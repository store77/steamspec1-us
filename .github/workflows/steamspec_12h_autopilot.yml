name: SteamSpec 12-Hour Amazon Affiliate & IndexNow Autopilot

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run SteamSpec 12H Generator (20 Products + 5 Review Articles + IndexNow)
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -n "$CUSTOM_SITE_URL" ]; then
            export SITE_URL="$CUSTOM_SITE_URL"
          else
            export SITE_URL="https://${OWNER}.github.io/${REPO_NAME}"
          fi
          echo "Active Storefront URL: $SITE_URL"
          python steamspec_engine.py

      - name: Commit & Push Updated Storefront to GitHub Pages (/docs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No changes detected in this cycle."
          else
            git commit -m "chore(12h-autopilot): publish 20 Steam hardware kits + 5 review guides [skip ci]"
            git push
          fi
